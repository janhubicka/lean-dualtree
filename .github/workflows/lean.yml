name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Regress finite skew meet closure
        run: python3 scripts/check-skew-meet.py

      - name: Regress finite Q order repair candidates
        run: python3 scripts/check-q-order-repair.py

      - name: Regress ternary Q order repair candidates
        run: python3 scripts/check-q-order-repair-ternary.py

      - name: Check TeX ledger encoding
        run: python3 scripts/check-audit-tex.py

      - name: Audit source-facing validation facts
        run: |
          mkdir -p proof-audit
          lake env lean scripts/CheckDualTree.lean > proof-audit/dualtree-axioms.log 2>&1
          python3 scripts/check-axiom-log.py proof-audit/dualtree-axioms.log 701 || {
            cat proof-audit/dualtree-axioms.log
            exit 1
          }
