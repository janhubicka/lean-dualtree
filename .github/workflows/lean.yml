name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-
            lake-${{ runner.os }}-${{ runner.arch }}-

      - name: Install elan
        run: |
          # GitHub release downloads occasionally return transient HTTP 5xx.
          # Retry the entire installer because its nested binary download
          # does not inherit curl's --retry flags from this invocation.
          set -o pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 2 \
                https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "elan installation failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build fast core default target
        run: lake build

      - name: Build full dual-tree audit umbrella
        run: lake build DualTree

      - name: Regress finite skew meet closure
        run: python3 scripts/check-skew-meet.py

      - name: Regress finite Q order repair candidates
        run: python3 scripts/check-q-order-repair.py

      - name: Regress ternary Q order repair candidates
        run: python3 scripts/check-q-order-repair-ternary.py

      - name: Regress corrected forward Q on stretched initial sources
        run: python3 scripts/check-q-stretched-forward.py

      - name: Regress corrected Q on arbitrary source subsets
        run: python3 scripts/check-q-arbitrary-source.py

      - name: Regress arithmetic model boundary interval
        run: python3 scripts/check-model-boundary-heap.py

      - name: Check TeX ledger encoding
        run: python3 scripts/check-audit-tex.py

      - name: Audit source graph and reject redundant umbrella imports
        run: python3 scripts/audit-lean-library.py --verify-root-minimal

      - name: Audit source-facing validation facts
        run: |
          mkdir -p proof-audit
          lake env lean scripts/CheckDualTree.lean > proof-audit/dualtree-axioms.log 2>&1 || {
            cat proof-audit/dualtree-axioms.log
            exit 1
          }
          python3 scripts/check-axiom-log.py proof-audit/dualtree-axioms.log 1941 || {
            cat proof-audit/dualtree-axioms.log
            exit 1
          }
